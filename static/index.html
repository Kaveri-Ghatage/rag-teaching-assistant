<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Teaching Assistant</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:760px;margin:32px auto;padding:0 16px;color:#1a1a1a}
  h1{font-size:1.5rem;margin-bottom:4px} p.sub{color:#555;margin-top:0}
  form{display:flex;gap:8px;margin:20px 0}
  input{flex:1;padding:10px;font-size:1rem;border:1px solid #bbb;border-radius:6px}
  button{padding:10px 18px;font-size:1rem;border:0;border-radius:6px;background:#1d4ed8;color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  #answer{white-space:pre-wrap;background:#f5f7fb;padding:14px;border-radius:8px;display:none}
  .src{border-left:3px solid #1d4ed8;padding:6px 10px;margin:10px 0;background:#fafafa}
  .meta{font-size:.85rem;color:#555}
</style>
</head>
<body>
<h1>RAG Teaching Assistant</h1>
<p class="sub">Ask a question about the course. The answer is grounded in the lecture transcripts.</p>
<form id="f"><input id="q" placeholder="e.g. How do I create a link in HTML?" required minlength="3"><button id="b">Ask</button></form>
<div id="answer"></div>
<div id="sources"></div>
<script>
const f=document.getElementById('f'),q=document.getElementById('q'),b=document.getElementById('b');
const a=document.getElementById('answer'),s=document.getElementById('sources');
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
f.addEventListener('submit',async e=>{
  e.preventDefault();b.disabled=true;a.style.display='block';a.textContent='Thinking...';s.innerHTML='';
  try{
    const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});
    const d=await r.json();
    if(!r.ok){a.textContent=d.detail||'Something went wrong';return}
    a.textContent=d.answer;
    s.innerHTML='<h3>Sources</h3>'+d.sources.map(x=>'<div class="src"><div class="meta">Video '+esc(x.number)+': '+esc(x.title)+' ('+x.start+'s to '+x.end+'s)</div>'+esc(x.text)+'</div>').join('')+'<p class="meta">Answered in '+d.latency_seconds+' s</p>';
  }catch(err){a.textContent='Could not reach the server.'}
  finally{b.disabled=false}
});
</script>
</body>
</html>
