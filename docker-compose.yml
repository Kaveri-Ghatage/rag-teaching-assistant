services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
    stdin_open: true
    tty: true

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "8000:8000"

volumes:
  ollama_data:
